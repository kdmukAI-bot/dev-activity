[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pd-dev-activity"
version = "0.1.0"
description = "Dev-activity plugin for personal-dashboard: GitHub-style heatmap of daily SeedSigner / other dev activity from local git repos, personal forks, and project-lens engagement."
requires-python = ">=3.10"
dependencies = [
    "tomli; python_version<'3.11'",
]

[project.entry-points."personal_dashboard.modules"]
dev-activity = "pd_dev_activity.analyzer:Analyzer"

[project.scripts]
pd-dev-activity-scan = "pd_dev_activity.scanner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pd_dev_activity*"]
